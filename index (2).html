<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🍁 Autumn English — Present Simple</title>
<style>
:root{--ink:#302b2a;--paper:#fffdf8;--cream:#fff7e9;--orange:#c85a2d;--green:#5d7657;--red:#b8443d;--line:#eadcc8}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(180deg,#f5e7d0,#fff9ef 45%,#efe2ce);min-height:100vh}

.wrap{max-width:920px;margin:auto;padding:52px 18px}.hero,.card,.final,.vocabbox{background:var(--paper);border:1px solid var(--line);border-radius:24px;box-shadow:0 10px 30px #59411f12}
.hero{padding:30px;text-align:center}.hero h1{font-size:clamp(30px,5vw,46px);margin:0 0 8px;color:#5a3929}.subtitle{color:#765c49}
.rule{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px auto 0;max-width:720px;text-align:left}.rule div{padding:13px;border-radius:15px;background:var(--cream);border:1px solid #efdfc5}.rule b{color:var(--orange)}
.progress{position:sticky;top:8px;z-index:4;margin:18px 0;padding:11px 14px;background:#fffdf8ee;backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:17px}.bar{height:9px;background:#eadfce;border-radius:99px;overflow:hidden;margin-top:7px}.fill{height:100%;width:0;background:linear-gradient(90deg,#e7a23a,#c85a2d);transition:.3s}
.card{margin:14px 0;padding:22px}.qtop{display:flex;gap:9px;align-items:center}.num{background:var(--green);color:#fff;border-radius:99px;padding:5px 10px;font-weight:800}.kind{font-size:12px;color:#8c7764}.prompt{font-size:20px;font-weight:750;margin:11px 0 16px}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}button{font:inherit}.opt,.check,.reset{border-radius:14px;padding:12px 15px;cursor:pointer}.opt{border:1px solid #d9c8b1;background:var(--cream)}.opt:hover{border-color:var(--orange)}.opt.selected{background:#f4dfc4;border-color:var(--orange);font-weight:800}
.answer{width:100%;padding:13px;font-size:18px;border:1px solid #d9c8b1;border-radius:14px;background:#fffaf1;outline:none}.answer:focus{border-color:var(--orange);box-shadow:0 0 0 3px #c85a2d1f}
.actions{margin-top:13px}.check{background:var(--green);color:white;border:0;font-weight:750}.check:disabled{opacity:.45}.feedback{min-height:25px;margin-top:11px;font-weight:700}.ok{color:#467047}.bad{color:var(--red)}.explain{margin-top:7px;padding:11px 13px;background:#f7efe4;border-radius:12px;font-size:14px;color:var(--ink);font-weight:500}
.vocab{font-size:12px;color:#8b6e57;margin-top:10px}.vocab span,.word{display:inline-block;background:#f2eadc;border-radius:999px;padding:4px 8px;margin:3px 4px 0 0}
.final{display:none;text-align:center;padding:28px;margin-top:18px}.score{font-size:48px;font-weight:900;color:var(--orange)}.reset{border:0;background:var(--orange);color:white;font-weight:800}.vocabbox{margin-top:20px;padding:22px}.vocabbox h2{margin-top:0}
@media(max-width:650px){.rule,.choices{grid-template-columns:1fr}.prompt{font-size:18px}}
</style></head><body><div class="wrap">
<section class="hero"><h1>🍁 Autumn English</h1><p class="subtitle">Present Simple: <b>обычный глагол</b> или <b>to be</b>?</p>
</section>
<div class="progress"><b id="status">Проверено: 0 из 15</b><div class="bar"><div class="fill" id="fill"></div></div></div>
<main id="quiz"></main><section class="final" id="final"><div>🍁 Все задания проверены!</div><div class="score" id="score"></div><p id="message"></p><button class="reset" onclick="resetQuiz()">Пройти ещё раз</button></section>
<section class="vocabbox"><h2>🍂 Слова для закрепления</h2><p>Список взят из вашего файла; слова также встроены в задания.</p><div id="wordlist"></div></section>
</div>
<script>
const questions=[{"type": "choice", "prompt": "Mia ___ a digital designer.", "options": ["is", "works", "work"], "answer": 0, "explanation": "Профессия/статус: Mia is a digital designer. Здесь нужен to be.", "vocab": "digital designer"}, {"type": "text", "prompt": "My grandfather ___ in a village.", "options": ["lives"], "answer": 0, "explanation": "Live — обычный глагол. В 3-м лице: lives.", "vocab": "grandfather; live in a village"}, {"type": "choice", "prompt": "They ___ students.", "options": ["are", "is", "study"], "answer": 0, "explanation": "Student — статус. Для they используем are.", "vocab": "student"}, {"type": "text", "prompt": "Anna ___ Italian every day.", "options": ["studies"], "answer": 0, "explanation": "Study — обычный глагол. После Anna: studies.", "vocab": "study Italian; study every day"}, {"type": "choice", "prompt": "The police officer ___ at work on Monday.", "options": ["is", "work", "works"], "answer": 0, "explanation": "Здесь описывается состояние/место: is at work.", "vocab": "police officer; on Monday"}, {"type": "text", "prompt": "Tom ___ from home this Wednesday.", "options": ["works"], "answer": 0, "explanation": "Work — обычный глагол. Tom → works.", "vocab": "work from home; this Wednesday"}, {"type": "choice", "prompt": "My parents ___ at home tonight.", "options": ["are", "is", "live"], "answer": 0, "explanation": "Место/состояние: My parents are at home.", "vocab": "tonight"}, {"type": "text", "prompt": "She ___ the guitar on Saturday evening.", "options": ["plays"], "answer": 0, "explanation": "Play — обычный глагол. She → plays.", "vocab": "play the guitar; on Saturday evening"}, {"type": "choice", "prompt": "My cousins ___ in a band.", "options": ["play", "are play", "is"], "answer": 0, "explanation": "Play — обычный глагол. My cousins play in a band.", "vocab": "cousins; play in a band"}, {"type": "choice", "prompt": "My uncle ___ an engineer.", "options": ["works", "is", "are"], "answer": 1, "explanation": "Профессия: My uncle is an engineer.", "vocab": "uncle; engineer"}, {"type": "text", "prompt": "The students ___ hard every day.", "options": ["study"], "answer": 0, "explanation": "Students — множественное число, поэтому study.", "vocab": "study hard; every day"}, {"type": "choice", "prompt": "My grandmother ___ retired.", "options": ["is", "works", "are"], "answer": 0, "explanation": "Retired — статус, поэтому grandmother is retired.", "vocab": "grandmother; retired"}, {"type": "text", "prompt": "He ___ running on the weekend.", "options": ["goes"], "answer": 0, "explanation": "Go — обычный глагол. He → goes. Полная фраза: goes running.", "vocab": "go running; on the weekend"}, {"type": "choice", "prompt": "We ___ in a theatre.", "options": ["work", "works", "are"], "answer": 0, "explanation": "Work — обычный глагол. We work in a theatre.", "vocab": "work in a theatre"}, {"type": "choice", "prompt": "My sister ___ a student and ___ two sisters.", "options": ["is / has", "has / is", "is / have"], "answer": 0, "explanation": "Student — статус → is. Have — обычный глагол: my sister has.", "vocab": "student; have two sisters"}];
const vocab=["doctor", "nurse", "actor", "police officer", "shop assistant", "singer", "engineer", "lawyer", "pilot", "politician", "scientist", "writer", "digital designer", "retired", "unemployed", "manager", "driver", "student", "player", "worker", "at three o'clock", "at noon", "at half past nine", "at night", "on Monday", "on Tuesday afternoon", "on Saturday evening", "on Wednesday", "on the weekend", "this evening", "this afternoon", "this Wednesday", "this weekend", "this morning", "next Thursday", "next weekend", "next week", "tomorrow", "today", "tonight", "work in a theatre", "work for a company", "work from home", "get up early", "get up at 11", "get up late", "live in a village", "live with friends", "live alone", "have a car", "have a lot of money", "have two sisters", "study Italian", "study hard", "study every day", "go out a lot", "go to bed late", "go running", "teach students", "teach at a university", "teach English", "play the guitar", "play in a band", "play tennis", "grandfather", "grandmother", "grandparents", "husband", "wife", "son", "daughter", "mother", "father", "grandchildren", "aunt", "uncle", "nephews", "niece", "brother and sister", "cousins"];
const quiz=document.getElementById('quiz'),state=questions.map(()=>({done:false,selected:null}));
let score=0,checked=0;
function render(){quiz.innerHTML='';questions.forEach((q,i)=>{let c=document.createElement('section');c.className='card';c.id='q'+i;
let control=q.type==='choice'?'<div class="choices">'+q.options.map((o,j)=>'<button class="opt" data-i="'+j+'" onclick="selectOpt('+i+','+j+')">'+o+'</button>').join('')+'</div>':'<input class="answer" id="input'+i+'" autocomplete="off" placeholder="Введите форму глагола">';
c.innerHTML='<div class="qtop"><span class="num">'+(i+1)+'</span><span class="kind">'+(q.type==='choice'?'выберите ответ':'введите ответ')+'</span></div><div class="prompt">'+q.prompt+'</div>'+control+'<div class="actions"><button class="check" id="check'+i+'" onclick="check('+i+')">Проверить</button></div><div class="feedback" id="fb'+i+'"></div>';
quiz.appendChild(c)});update()}
function selectOpt(i,j){if(state[i].done)return;state[i].selected=j;document.querySelectorAll('#q'+i+' .opt').forEach((b,k)=>b.classList.toggle('selected',k===j))}
function check(i){if(state[i].done)return;let q=questions[i],val=q.type==='choice'?state[i].selected:document.getElementById('input'+i).value.trim().toLowerCase().replace(/\s+/g,' ');let ok=q.type==='choice'?val===q.answer:q.options.includes(val),fb=document.getElementById('fb'+i),correct=q.options[q.answer];
if(ok){score++;fb.innerHTML='✓ Верно! <div class="explain">'+q.explanation+'</div>';fb.className='feedback ok'}else{fb.innerHTML='✗ Правильный ответ: <b>'+correct+'</b><div class="explain">'+q.explanation+'</div>';fb.className='feedback bad'}
state[i].done=true;checked++;document.getElementById('check'+i).disabled=true;document.querySelectorAll('#q'+i+' .opt').forEach(b=>b.disabled=true);let inp=document.getElementById('input'+i);if(inp)inp.disabled=true;update();
if(checked===questions.length){document.getElementById('final').style.display='block';document.getElementById('score').textContent=score+'/15';document.getElementById('message').textContent=score===15?'🍁 Великолепно!':score>=11?'🌰 Отличная работа! Повтори ошибки и попробуй ещё раз.':score>=8?'🍂 Хорошее начало! Ещё немного практики.':'🍁 Повтори правило и попробуй тест ещё раз.';document.getElementById('final').scrollIntoView({behavior:'smooth',block:'center'})}}
function update(){document.getElementById('status').textContent='Проверено: '+checked+' из 15';document.getElementById('fill').style.width=(checked/15*100)+'%'}
function resetQuiz(){score=0;checked=0;state.forEach(x=>{x.done=false;x.selected=null});document.getElementById('final').style.display='none';render();scrollTo({top:0,behavior:'smooth'})}
document.getElementById('wordlist').innerHTML=vocab.map(w=>'<span class="word">'+w+'</span>').join('');render();
</script></body></html>
